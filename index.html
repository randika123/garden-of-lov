<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garden of Love - For Dinithi</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,800;1,400&family=Playfair+Display:ital,wght@0,600;1,600&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0d0d0d;
            color: #ffffff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .playfair {
            font-family: 'Playfair Display', serif;
        }

        /* Floating animation for emoji row */
        .flower-float {
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(5deg); }
        }

        /* Dynamic floating particles */
        .floating-element {
            position: fixed;
            bottom: -60px;
            font-size: 2rem;
            animation: rise 4.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            pointer-events: none;
            z-index: 50;
            filter: drop-shadow(0 0 8px rgba(255, 105, 180, 0.6));
        }

        @keyframes rise {
            0% {
                transform: translateY(0) scale(0.6) rotate(0deg);
                opacity: 0;
            }
            15% {
                opacity: 1;
            }
            85% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(-110vh) scale(1.3) rotate(360deg);
                opacity: 0;
            }
        }

        /* Ambient background glow elements */
        .bg-glow {
            position: absolute;
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(247, 224, 37, 0.15) 0%, rgba(255, 64, 129, 0.12) 50%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        /* Pulsing glowing interactive button */
        .btn-love {
            background: linear-gradient(135deg, #ff4081 0%, #ff80ab 100%);
            box-shadow: 0 0 20px rgba(255, 64, 129, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.4);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-love:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 0 30px rgba(255, 64, 129, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.6);
        }

        .btn-love:active {
            transform: translateY(1px) scale(0.97);
        }

        /* Revealed message animation */
        .love-msg-anim {
            animation: zoomInLove 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes zoomInLove {
            0% {
                opacity: 0;
                transform: scale(0.5) translateY(20px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4 relative select-none">

    <!-- Ambient background light effects -->
    <div class="bg-glow top-10 left-1/2 -translate-x-1/2"></div>
    <div class="bg-glow bottom-10 left-10"></div>
    <div class="bg-glow bottom-10 right-10"></div>

    <!-- Main Content Container -->
    <main class="relative z-10 max-w-lg w-full text-center flex flex-col items-center justify-center py-8 px-4">
        
        <!-- Header Title -->
        <h1 class="text-3xl sm:text-4xl font-extrabold text-[#f7e025] mb-4 tracking-wide leading-tight drop-shadow-[0_0_12px_rgba(247,224,37,0.4)]">
            A Special Garden<br>For You 🌸
        </h1>

        <!-- Animated Flower Row -->
        <div class="flower-float flex gap-3 text-3xl sm:text-4xl my-4 justify-center items-center drop-shadow-md">
            <span class="hover:scale-125 transition-transform duration-200">🌺</span>
            <span class="hover:scale-125 transition-transform duration-200">🌹</span>
            <span class="hover:scale-125 transition-transform duration-200">🌷</span>
            <span class="hover:scale-125 transition-transform duration-200">🪷</span>
            <span class="hover:scale-125 transition-transform duration-200">🌸</span>
        </div>

        <!-- Couple Subtitle -->
        <div class="text-pink-300 font-semibold text-lg sm:text-xl tracking-wider my-2 py-1 px-4 rounded-full bg-pink-950/30 border border-pink-500/20 backdrop-blur-sm shadow-inner">
            ✨ Randika + Dinithi ✨
        </div>

        <!-- Main Garden Title -->
        <h2 class="text-4xl sm:text-5xl font-black text-[#f7e025] my-4 playfair tracking-tight drop-shadow-[0_0_18px_rgba(247,224,37,0.5)]">
            Garden of Love 💖
        </h2>

        <!-- Description -->
        <p class="text-gray-300 text-base sm:text-lg leading-relaxed my-4 max-w-md font-light">
            A little garden built with feeling, created specially for you to bring a smile to your face. 🌿<br>
            <span class="text-sm text-pink-300/80 italic mt-1 block">Press the button below!</span>
        </p>

        <!-- Main Action Button -->
        <div class="mt-4 mb-2">
            <button id="loveBtn" onclick="expressLove()" class="btn-love text-white font-bold text-lg sm:text-xl px-8 py-4 rounded-full cursor-pointer flex items-center justify-center gap-2 transform active:scale-95 transition-all">
                I love you sudu manika 💖
            </button>
        </div>

        <!-- Revealed Love Message -->
        <div id="loveMessage" class="hidden mt-6 p-4 rounded-2xl bg-gradient-to-r from-pink-900/40 via-red-900/30 to-pink-900/40 border border-pink-500/30 backdrop-blur-md">
            <p class="love-msg-anim text-2xl sm:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-300 via-rose-300 to-amber-200 drop-shadow-[0_0_10px_rgba(255,105,180,0.8)]">
                I Love You Dinithi! 💖🌸✨
            </p>
        </div>

    </main>

    <!-- Footer -->
    <footer class="relative z-10 mt-auto pt-6 text-xs text-gray-500 tracking-widest uppercase">
        Created with ❤️ by Randika
    </footer>

    <script>
        function expressLove() {
            // Reveal the glowing message
            const loveMsg = document.getElementById('loveMessage');
            loveMsg.classList.remove('hidden');

            // Trigger floating particles animation
            const items = ['🌸', '🌹', '🌺', '🌷', '✨', '💖', '❤️', '💕', '🪷'];
            const totalParticles = 40;

            for (let i = 0; i < totalParticles; i++) {
                setTimeout(() => {
                    createFloatingParticle(items);
                }, i * 110);
            }
        }

        function createFloatingParticle(items) {
            const particle = document.createElement('div');
            particle.classList.add('floating-element');
            
            // Randomly select emoji
            particle.innerText = items[Math.floor(Math.random() * items.length)];
            
            // Random horizontal positioning
            particle.style.left = Math.random() * 92 + 4 + 'vw';
            
            // Random animation duration
            const duration = Math.random() * 2.5 + 3;
            particle.style.animationDuration = duration + 's';
            
            // Random scale variation
            const scale = Math.random() * 0.8 + 1;
            particle.style.fontSize = `${scale}rem`;

            document.body.appendChild(particle);

            // Cleanup particle element after completion
            setTimeout(() => {
                particle.remove();
            }, duration * 1000);
        }
    </script>
</body>
</html>
